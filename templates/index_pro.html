<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIA PRO UI</title>

<style>

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
body{
    height:100vh;
    overflow:hidden;
    font-family:Inter, sans-serif;
    background:linear-gradient(135deg,#f3e8ff,#e0f2fe);
    transition:.4s;
}

/* ================= ESTADOS ================= */
body[data-state="escuchando"]{ --accent:#22c55e;}
body[data-state="pensando"]{ --accent:#a855f7;}
body[data-state="hablando"]{ --accent:#fb923c;}
body.pouring{ --accent:#f59e0b;}

:root{
    --accent:#a855f7;
    --glass:rgba(255,255,255,.55);
    --blur:blur(16px);
}

/* ================= APP ================= */
.app{
    height:100%;
    display:grid;
    grid-template-rows:50px 1fr 90px;
    gap:10px;
    padding:10px;
}

/* ================= TOP ================= */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
}

/* ================= STAGE ================= */
.stage{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:10px;
    position:relative;
}

/* ================= MENU ================= */
.side-left{
    background:var(--glass);
    backdrop-filter:var(--blur);
    border-radius:18px;
    padding:10px;
}

.menu-item{
    padding:8px;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}
.menu-item:hover{
    background:rgba(255,255,255,.5);
}

/* ================= CENTER ================= */
.center{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ================= AVATAR ================= */
.avatar-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar-ring{
    width:100%;
    aspect-ratio:16/9;
    position:relative;
}

.avatar-ring::before{
    content:"";
    position:absolute;
    inset:-5%;
    border-radius:50%;
    background:radial-gradient(circle,var(--accent),transparent 70%);
    opacity:.25;
    filter:blur(40px);
    transition:.4s;
}

body.pouring .avatar-ring::before{
    opacity:.1;
}

#avatar-img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:22px;
    box-shadow:0 10px 40px rgba(0,0,0,.15);
}

/* ================= SUBTITLE ================= */
.subtitle-box{
    height:90px;
    background:var(--glass);
    backdrop-filter:var(--blur);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
}

#subtitle-text{
    font-size:1.1rem;
    line-height:1.3;
}

/* ================= RAIL HUD ================= */
#rail-panel{
    position:absolute;
    right:10px;
    top:60px;
    bottom:90px;
    width:85px;

    background:var(--glass);
    backdrop-filter:var(--blur);
    border-radius:18px;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    opacity:0;
    transform:translateX(30px);
    transition:.35s;
}

body.pouring #rail-panel{
    opacity:1;
    transform:translateX(0);
}

/* ================= MIC ================= */
.bottombar{
    display:flex;
    justify-content:center;
    align-items:center;
}

#btn-mic{
    width:80px;
    height:80px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#a855f7,#60a5fa);
    color:white;
    font-size:30px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transition:.2s;
}

#btn-mic:active{
    transform:scale(.9);
}

/* ================= RESPONSIVE ================= */
@media(max-height:500px){

    .stage{
        grid-template-columns:140px 1fr;
    }

    .avatar-ring{
        max-height:220px;
    }

    .subtitle-box{
        height:60px;
    }

    #subtitle-text{
        font-size:.9rem;
    }

    #rail-panel{
        width:65px;
    }

    #btn-mic{
        width:60px;
        height:60px;
    }
}

</style>
</head>

<body data-state="escuchando">

<div class="app">

    <div class="topbar">
        <span>🟢 MIA Conectada</span>
        <span>Di "Mia"</span>
    </div>

    <div class="stage">

        <aside class="side-left">
            <div class="menu-item">Paloma</div>
            <div class="menu-item">Margarita</div>
            <div class="menu-item">Tequila Citrus</div>
        </aside>

        <section class="center">

            <div class="avatar-container">
                <div class="avatar-ring">
                    <img id="avatar-img" src="https://i.imgur.com/7yUvePI.png">
                </div>
            </div>

            <div class="subtitle-box">
                <p id="subtitle-text">Te escucho...</p>
            </div>

        </section>

        <div id="rail-panel"></div>

    </div>

    <div class="bottombar">
        <button id="btn-mic">🎤</button>
    </div>

</div>

<script>

/* DEMO estados */
setTimeout(()=>document.body.dataset.state="pensando",2000);
setTimeout(()=>document.body.dataset.state="hablando",4000);
setTimeout(()=>document.body.classList.add("pouring"),6000);

</script>

</body>
</html>
